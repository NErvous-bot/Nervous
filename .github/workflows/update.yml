name: 更新书源
on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node filter.js
      - name: 镜像线路探活
        run: node probe.js
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legado.json urls.txt candidates.txt
          git diff --cached --quiet || (git commit -m "auto update" && git pull --rebase origin main && git push)
