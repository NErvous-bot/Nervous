name: 编译同步App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 还原签名密钥
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > SourceAutoSync/keystore.jks
          echo "keystore大小: $(stat -c%s SourceAutoSync/keystore.jks) 字节"
      - name: 源文件诊断
        run: |
          echo "### runner上的源文件指纹" >> $GITHUB_STEP_SUMMARY
          md5sum SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY
          sed -n '73,92p' SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: 编译（release 固定签名，以后可覆盖安装）
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd SourceAutoSync
          set -o pipefail
          gradle assembleRelease --no-build-cache --rerun-tasks 2>&1 | tee build.log
      - name: 错误摘要
        if: failure()
        run: |
          echo "### 编译错误（前20条）" >> $GITHUB_STEP_SUMMARY
          grep -m 20 -A4 "error:" SourceAutoSync/build.log >> $GITHUB_STEP_SUMMARY || echo "未见error行" >> $GITHUB_STEP_SUMMARY
      - name: 保存APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: SourceAutoSync/app/build/outputs/apk/release/app-release.apk
