name: 编译同步App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压项目
        run: unzip -o SourceAutoSync.zip -d .
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: 编译
        run: |
          cd SourceAutoSync
          set -o pipefail
          gradle assembleDebug --no-build-cache --rerun-tasks 2>&1 | tee build.log
      - name: 错误摘要
        if: failure()
        run: |
          echo "### 编译错误（前20条）" >> $GITHUB_STEP_SUMMARY
          grep -m 20 -A4 "error:" SourceAutoSync/build.log >> $GITHUB_STEP_SUMMARY || echo "未见error行" >> $GITHUB_STEP_SUMMARY
      - name: 保存APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: SourceAutoSync/app/build/outputs/apk/debug/app-debug.apk
